baseURL: "https://blog.yurikale.top"
title: "羽衣甘蓝的博客"
theme: PaperMod
paginate: 10
enableRobotsTXT: true

languages:
  zh:
    contentDir: content
    label: "中文"
    weight: 1

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives
      weight: 10
    - identifier: math
      name: 数学笔记
      url: /math
      weight: 15
    - identifier: gallery
      name: 随手拍
      url: /gallery
      weight: 17
    - identifier: search
      name: 搜索
      url: /search
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags
      weight: 30

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '$'
              - '$'

params:
  env: production
  description: ""
  defaultTheme: auto
  disableThemeToggle: false
  mainSections: ["post", "math"]
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNaviButtons: true
  ShowToc: true
  TocOpen: true

  homeInfoParams:
    Title: "有朋从远方来，不亦乐乎？"
    Content: >
      余，准大一之生也，然志于编程久矣。自束发弄码，
      涉猎前后端、系统、网络诸域，虽未深至，亦颇有心得。
      今将入大学之堂，仍以开发者自居，欲精进而已。
      此博客者，录所学，记所思，亦以交天下同好也。

  socialIcons:
    - name: github
      url: "https://github.com/HydroGest"
    - name: bilibili
      url: "https://space.bilibili.com/436359880"