baseURL: "https://blog.yurikale.top"
title: "羽衣甘蓝的博客"
theme: PaperMod
paginate: 10
enableRobotsTXT: true

languages:
  zh:
    contentDir: content
    label: "中文"
    weight: 1

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives
      weight: 10
    - identifier: math
      name: 数学笔记
      url: /math
      weight: 15
    - identifier: huli_house
      name: 梨窝
      url: /huli_house
      weight: 16
    - identifier: gallery
      name: 随手拍
      url: /gallery
      weight: 17
    - identifier: search
      name: 搜索
      url: /search
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags
      weight: 30

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '$'
              - '$'

params:
  env: production
  description: ""
  defaultTheme: auto
  disableThemeToggle: false
  mainSections: ["post", "math"]
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNaviButtons: true
  ShowToc: true
  TocOpen: true

  homeInfoParams:
    Title: "有朋从远方来，不亦乐乎？"
    Content: >
      我是羽衣甘蓝_Yurikale，你也可以叫我 Markchai。这里是我的个人博客，记录一些生活、学习和工作中的点滴。

  socialIcons:
    - name: github
      url: "https://github.com/HydroGest"
    - name: bilibili
      url: "https://space.bilibili.com/436359880"
    - name: zhihu
      url: "https://www.zhihu.com/people/hydrogest"
